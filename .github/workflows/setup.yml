name: setup

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Chromium system libraries
        run: |
          version=$(python -c 'import re, pathlib; text = pathlib.Path("backend/requirements.lock").read_text(encoding="utf-8"); print(re.search(r"(?m)^playwright==(\S+)", text).group(1))')
          python -m pip install "playwright==${version}"
          python -m playwright install-deps chromium

      - name: Create the virtualenv
        env:
          PYTHON: python
        run: bash scripts/setup.sh

      - name: Non-integration tests
        working-directory: backend
        run: .venv/bin/python -m pytest -m "not integration"
